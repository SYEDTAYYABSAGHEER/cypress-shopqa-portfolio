<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopQA — Demo Store</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <main class="login-card" data-testid="login-page">
        <p class="eyebrow">ShopQA Demo</p>
        <h1>Sign in to shop</h1>
        <p class="subtitle">Practice Cypress against a real shopping flow.</p>

        <form id="login-form" data-testid="login-form" novalidate>
          <label for="username">Username</label>
          <input
            id="username"
            name="username"
            data-testid="username"
            autocomplete="username"
            placeholder="standard_user"
          />

          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            data-testid="password"
            autocomplete="current-password"
            placeholder="secret_sauce"
          />

          <button type="submit" data-testid="login-button" class="btn primary">
            Login
          </button>
        </form>

        <div
          id="error-message"
          data-testid="error-message"
          class="error"
          hidden
          role="alert"
        ></div>

        <aside class="hint" data-testid="login-hint">
          <strong>Demo accounts</strong>
          <ul>
            <li><code>standard_user</code> / <code>secret_sauce</code></li>
            <li><code>locked_out_user</code> / <code>secret_sauce</code></li>
            <li><code>problem_user</code> / <code>secret_sauce</code></li>
          </ul>
        </aside>
      </main>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
