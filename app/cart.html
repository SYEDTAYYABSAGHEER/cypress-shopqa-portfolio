<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart — ShopQA</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar" data-testid="header">
      <a href="products.html" class="brand" data-testid="brand">ShopQA</a>
      <div class="topbar-actions">
        <span data-testid="user-greeting" class="user-greeting"></span>
        <a href="cart.html" class="cart-link" data-testid="cart-link">
          Cart
          <span class="badge" data-testid="cart-badge">0</span>
        </a>
        <button type="button" class="btn ghost" data-testid="logout-button">
          Logout
        </button>
      </div>
    </header>

    <main class="page" data-testid="cart-page">
      <h1 data-testid="cart-title">Your cart</h1>
      <div id="cart-empty" data-testid="cart-empty" class="empty" hidden>
        Your cart is empty.
        <a href="products.html" data-testid="continue-shopping">Continue shopping</a>
      </div>

      <ul id="cart-items" data-testid="cart-items" class="cart-list"></ul>

      <div id="cart-summary" data-testid="cart-summary" class="cart-summary" hidden>
        <p>
          Subtotal:
          <strong data-testid="cart-subtotal">$0.00</strong>
        </p>
        <a href="checkout.html" class="btn primary" data-testid="checkout-button">
          Checkout
        </a>
        <a href="products.html" class="btn ghost" data-testid="back-to-products">
          Back to products
        </a>
      </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/cart-page.js"></script>
  </body>
</html>
